<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="application-name" content="天運者">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="天運者">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>天運者</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE 史詩、蒼涼、帶詭異；君主案頭的戰略感
   IDEA 青銅星盤＋光榮三國志的軍議桌：地圖是主角，指令像蓋印
   PICTURE 六角格荒原地圖、英靈立繪、CG
   COLOUR 墨黑底、青銅金、玉青；敵血紅、污染紫
   TYPE Noto Serif TC 標題／Noto Sans TC 內文；LAYOUT 手機直式，桌機置中 480px */
:root{color-scheme:dark;--bg:#0b0c10;--ink:#ece6d8;--dim:#a39c8c;--gold:#c9a45c;--gold2:#f0d79a;--jade:#5fb3a1;--blood:#d0554a;--void:#9a6be0;--pink:#f3b1c4;--panel:rgba(14,15,20,.92);--line:rgba(201,164,92,.38);--card:linear-gradient(180deg,#17181f,#101116)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{margin:0;background:#050506;color:var(--ink);font:15px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow:hidden}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
#app.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
#danger{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;transition:opacity 1s;background:radial-gradient(ellipse at center,transparent 45%,rgba(70,20,110,.55) 85%,rgba(30,0,40,.85));animation:dpulse 2.4s infinite}
#app.dang #danger{opacity:1}
@keyframes dpulse{50%{filter:brightness(1.5)}}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;animation:fade .35s}
.scr.on{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center}#stBg{background-size:0 0;isolation:isolate;overflow:hidden}#stBg::before,#stBg::after{content:'';position:absolute;background-image:inherit;background-repeat:no-repeat}#stBg::before{inset:-40px;background-size:cover;background-position:center;filter:blur(22px) brightness(.42)}#stBg::after{inset:0;background-size:contain;background-position:center 18%}
.bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,8,.15),rgba(5,5,8,.25) 45%,rgba(5,5,8,.92))}
.top{position:relative;z-index:2}
h1,h2,h3{font-family:"Noto Serif TC",serif;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:48px;font-weight:900;letter-spacing:.08em;color:var(--gold2);text-shadow:0 2px 24px #000}
h2{font-size:24px;font-weight:900;color:var(--gold2)}
h3{font-size:17px;font-weight:700}
.small{font-size:13px;color:var(--dim)}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold2);font-family:"Noto Serif TC",serif;font-weight:900;font-size:17px;margin:4px 0 10px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{background:linear-gradient(90deg,var(--gold),transparent)}
.frame{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.4),inset 0 0 0 4px rgba(201,164,92,.12)}
.frame::before,.frame::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--gold);pointer-events:none}
.frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;position:relative;overflow:hidden}
.btn{min-height:46px;padding:10px 18px;border-radius:4px;background:linear-gradient(180deg,#e0bf74,#9c7a35);color:#1a1408;font-weight:700;font-size:16px;letter-spacing:.06em;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 16px rgba(0,0,0,.5);transition:transform .08s,filter .15s}
.btn.ghost{background:rgba(10,10,14,.75);color:var(--gold2);border:1px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(180deg,#d9695c,#8f2e25);color:#fff}
.btn.jade{background:linear-gradient(180deg,#7fd0bd,#2f7a6a);color:#06221c}
.btn:disabled{filter:grayscale(1) brightness(.5);cursor:default}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
button:active:not(:disabled){transform:scale(.96);filter:brightness(1.15)}
.rip{position:absolute;border-radius:50%;background:rgba(255,240,200,.45);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#fx{position:absolute;inset:0;z-index:90;pointer-events:none}
.mute{position:absolute;top:8px;right:8px;z-index:95;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid var(--line);display:grid;place-items:center}
.mute svg{width:18px;height:18px;fill:var(--gold2)}
/* title & story */
#title{justify-content:flex-end;padding:0 24px 56px;text-align:center}
#title .sub{margin:12px 0 28px}
#story{justify-content:flex-end}
.box{position:relative;z-index:2;margin:16px;padding:18px 18px 14px;min-height:140px}
.who{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--gold2);margin-bottom:6px;font-size:17px}
.box.sys{border-color:rgba(95,179,161,.6);background:rgba(8,20,22,.94)}.box.sys .who{color:var(--jade)}.box.sys .txt{color:#cfeee6}
.box.narr .who{display:none}.box.narr .txt{font-family:"Noto Serif TC",serif;font-size:17px}
.tap{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--dim);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.box .face{position:absolute;right:12px;top:-104px;width:84px;height:112px;border-radius:6px;background-size:cover;background-position:center 15%;border:1px solid var(--gold);box-shadow:0 4px 18px #000;display:none}
.box.hasface .face{display:block}
.skip{position:absolute;top:10px;left:10px;z-index:3;font-size:13px;color:var(--dim);padding:10px}
/* summon */
#summon{padding:56px 16px 28px}
.pools{position:relative;z-index:2;display:grid;gap:12px;margin-top:auto}
.pool{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:72px;text-align:left}
.pool b{font-family:"Noto Serif TC",serif;font-size:21px;color:var(--gold2);width:3.2em;flex:none}
.pool span{font-size:14px;color:var(--dim)}
.pool .tag{margin-left:auto;font-size:12px;color:var(--jade);flex:none;font-style:normal}
.sysline{position:relative;z-index:2;padding:12px 14px;margin-bottom:12px;background:rgba(8,20,22,.94);border:1px solid rgba(95,179,161,.6);border-radius:6px;color:#cfeee6;font-size:15px}
.sysline b{color:var(--jade)}
#reveal{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;background:#000;overflow-y:auto}
#reveal.on{display:flex}
.pillar{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse 22% 70% at 50% 55%,rgba(255,236,170,.95),rgba(201,164,92,.35) 45%,transparent 70%);animation:pil 1.2s ease-out forwards}
.pillar.ssr{background:radial-gradient(ellipse 26% 78% at 50% 55%,#fff6d8,rgba(240,180,80,.7) 40%,rgba(180,60,40,.25) 65%,transparent 78%)}
@keyframes pil{0%{opacity:0;transform:scaleY(.2)}30%{opacity:1;transform:scaleY(1)}100%{opacity:0}}
.rv-art{position:relative;height:58vh;min-height:330px;max-height:620px;background-size:cover;background-position:center 15%;flex:none;animation:zoom 1.4s ease-out}
@keyframes zoom{from{transform:scale(1.12);filter:brightness(2)}to{transform:none;filter:none}}
.rv-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#000)}
.rar{position:absolute;top:14px;left:14px;z-index:2;font-family:"Noto Serif TC",serif;font-weight:900;font-size:30px;text-shadow:0 2px 12px #000}
.rar.SSR{color:#ffd77a}.rar.SR{color:#b9d4ff}
.rv-body{padding:0 20px 24px;margin-top:-56px;position:relative;z-index:2}
.rv-body h2{font-size:36px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--gold2);white-space:nowrap}
.chip.j{border-color:rgba(95,179,161,.6);color:var(--jade)}.chip.r{border-color:rgba(208,85,74,.6);color:#f0a097}.chip.v{border-color:rgba(154,107,224,.6);color:#c7a9ff}.chip.p{border-color:rgba(243,177,196,.6);color:var(--pink)}
.quote{font-family:"Noto Serif TC",serif;font-size:16px;margin:0 0 12px;padding-left:12px;border-left:2px solid var(--gold)}
/* game shell */
.hud{position:relative;z-index:5;padding:6px 50px 6px 10px;background:linear-gradient(180deg,#0f1015,#08080b);border-bottom:1px solid var(--line);flex:none}
.hud .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--gold2);white-space:nowrap;font-size:15px}
.res{display:flex;align-items:center;gap:3px;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .3s}
.res img{width:19px;height:19px;border-radius:4px;object-fit:cover}
.res.up{color:var(--jade);animation:bump .5s}.res.dn{color:var(--blood);animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.tidebar{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px}
.tidebar .meter{flex:1;height:7px}
.tidebar.warn{color:#e6c7ff}
.tidebar.warn .meter i{background:linear-gradient(90deg,#9a6be0,#d0554a);animation:pulse 1s infinite}
.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding-bottom:84px}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr) 1.2fr;background:linear-gradient(180deg,#0e0f14,#060608);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{min-height:58px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.nav button b{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:900}
.nav button.on{color:var(--gold2)}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--gold2);box-shadow:0 0 8px var(--gold2)}
.nav .end{background:linear-gradient(180deg,#e0bf74,#9c7a35);color:#1a1408;font-weight:700}
.nav .end b{color:#1a1408}
.dot{position:absolute;top:8px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--blood);box-shadow:0 0 6px var(--blood)}
.sec{padding:12px 14px 4px}
.tip{font-size:13px;color:var(--dim);margin:-4px 0 10px}
.meter{height:8px;background:#26262c;border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--jade);transition:width .4s}
/* map */
.mapbox{position:relative;height:50vh;min-height:300px;max-height:560px;overflow:hidden;touch-action:none;background:#050508;border-bottom:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:100%}
.mapctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mapctl button{width:40px;height:40px;border-radius:8px;background:rgba(10,10,14,.85);border:1px solid var(--line);color:var(--gold2);font-size:20px;font-weight:700}
.yl{font-size:6.5px;fill:#fff3cf;paint-order:stroke;stroke:#000;stroke-width:1.6px;font-family:Noto Sans TC}
.hex{cursor:pointer}
.hex .sel{fill:none;stroke:var(--gold2);stroke-width:3;opacity:0}
.hex.on .sel{opacity:1}
.hex.exp .sel{opacity:.9;stroke:#f0d79a;stroke-dasharray:3 3;stroke-width:1.6}
.pol{fill:#5a2a9a;opacity:.55;animation:pulse 3s infinite}
.pol.new{animation:newpol 1.5s 2}
@keyframes newpol{50%{fill:#d04aff;opacity:.9}}
@keyframes pulse{50%{opacity:.32}}
.owntint{fill:#c9a45c;opacity:.14}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:6px 12px;font-size:12px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.tileinfo{margin:8px 12px;padding:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts .btn{flex:1 1 auto}
.cost{font-size:12px;color:var(--dim);margin-top:4px}
.cost b{color:var(--ink);font-weight:500}.cost .no{color:var(--blood)}
/* base */
.basehero{position:relative;height:170px;background-size:cover;background-position:center 40%;flex:none}
.basehero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,var(--bg))}
.basehero .cap{position:absolute;left:14px;right:14px;bottom:8px;z-index:2}
.stage{display:flex;gap:4px;margin-top:6px}
.stage span{flex:1;font-size:11px;text-align:center;padding:2px 0;border-radius:3px;background:#1a1b21;color:var(--dim);border:1px solid #2a2b31}
.stage span.on{background:linear-gradient(180deg,#e0bf74,#9c7a35);color:#1a1408;border-color:#e0bf74;font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0}
.kpi div{padding:6px;text-align:center;font-size:11px;color:var(--dim)}
.kpi b{display:block;font-size:17px;color:var(--ink);font-family:"Noto Serif TC",serif;font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{position:relative;aspect-ratio:3/4;border-radius:6px;border:1px dashed var(--line);background:#121318;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px;text-align:center;font-size:12px;overflow:hidden}
.slot.b{border-style:solid;background-size:cover;background-position:center}
.slot.b::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.9))}
.slot>*{position:relative}
.slot .nm{font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;color:var(--gold2)}
.slot .lv{position:absolute;top:5px;left:5px;font-size:11px;font-weight:700;background:rgba(0,0,0,.75);border:1px solid var(--gold);color:var(--gold2);padding:0 5px;border-radius:3px}
.slot .gar{position:absolute;top:5px;right:5px;width:32px;height:42px;border-radius:4px;background-size:cover;background-position:center 15%;border:1px solid var(--gold)}
.slot .gar.sp{border-color:var(--jade);box-shadow:0 0 8px var(--jade)}
.slot .plus{font-size:28px;color:var(--gold);margin:auto}
.slot .prog{position:absolute;left:6px;right:6px;top:24px;height:5px;background:#333;border-radius:3px;overflow:hidden}
.slot .prog i{display:block;height:100%;background:var(--gold2)}
.slot .out{font-size:11px;color:var(--jade)}
.slot.lock{opacity:.5}
/* heroes */
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hcard{position:relative;aspect-ratio:3/4.4;border-radius:6px;overflow:hidden;background-size:cover;background-position:center 12%;border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:6px}
.hcard.SSR{border-color:#d9b25c;box-shadow:inset 0 0 0 1px #6b5526}
.hcard::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.92))}
.hcard>*{position:relative}
.hcard .r{position:absolute;top:4px;left:5px;font-family:"Noto Serif TC",serif;font-weight:900;font-size:13px;text-shadow:0 1px 4px #000}
.hcard .r.SSR{color:#ffd77a}.hcard .r.SR{color:#b9d4ff}
.hcard .st{position:absolute;top:4px;right:5px;font-size:10px;color:#ffd77a;text-shadow:0 1px 3px #000}
.hcard b{font-family:"Noto Serif TC",serif;font-size:15px}
.hcard .tk{font-size:11px;color:var(--jade)}.hcard .tk.idle{color:var(--blood)}
/* hero panel */
#hp{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;background:#07070a;overflow-y:auto;animation:fade .25s}
#hp.on{display:flex}
.hp-art{position:relative;height:56vh;min-height:320px;background-size:cover;background-position:center 12%;flex:none}
.hp-art::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 20%,transparent 55%,#07070a)}
.hp-close{position:absolute;top:8px;left:8px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid var(--line);color:var(--gold2);font-size:20px}
.hp-head{position:relative;z-index:2;margin-top:-90px;padding:0 16px}
.hp-head h2{font-size:38px}
.stars{color:#ffd77a;letter-spacing:2px;font-size:15px}
.stars i{color:#444;font-style:normal}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;margin:10px 0}
.radar svg{width:100%;height:auto;display:block}
.bars>div{margin-bottom:8px;font-size:12px;color:var(--dim)}
.bars .meter{margin-top:3px}
.skl{padding:10px 12px;margin-bottom:8px}
.skl .k{font-size:11px;padding:1px 7px;border-radius:3px;margin-right:6px;font-weight:700}
.k.in{background:#6b5526;color:#ffe7a8}.k.pa{background:#1f3d36;color:#9fe3d2}.k.ac{background:#4a1f1b;color:#ffb2a8}.k.bo{background:#40203a;color:var(--pink)}
.skl b{font-size:15px}
.skl .d{font-size:13px;color:var(--dim);margin-top:2px}
.skl.lock{opacity:.45}
/* sheet */
.sheet{position:absolute;inset:0;z-index:65;display:none;align-items:flex-end;background:rgba(0,0,0,.62)}
.sheet.on{display:flex}
.sheet .in{width:100%;max-height:88%;overflow-y:auto;background:#121318;border-top:1px solid var(--gold);border-radius:12px 12px 0 0;padding:16px 14px 22px;animation:up .25s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.opt{display:flex;gap:12px;align-items:center;width:100%;padding:9px;border-radius:6px;text-align:left;min-height:56px;border:1px solid transparent}
.opt:hover,.opt:focus-visible{background:#1c1d24}
.opt.on{background:#1f2a27;border-color:rgba(95,179,161,.5)}
.opt.no{opacity:.45}
.opt .pic{width:42px;height:56px;border-radius:4px;background-size:cover;background-position:center 15%;flex:none}
.opt .ic{width:46px;height:46px;border-radius:5px;background-size:cover;background-position:center;flex:none}
.opt .t{flex:1}.opt .t div{font-size:12px;color:var(--dim)}
.opt b{font-size:15px}
.opt .pv{font-size:13px;color:var(--jade);white-space:nowrap;text-align:right}
.spec{color:var(--jade)!important}
.sum{display:grid;gap:6px;margin:10px 0 14px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;background:#1a1b21;border-radius:5px;font-size:14px}
.sum .pos{color:var(--jade)}.sum .neg{color:var(--blood)}
.dlg{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.dlg .pic{width:84px;height:112px;border-radius:6px;background-size:cover;background-position:center 15%;flex:none;border:1px solid var(--gold)}
.dlg p{margin:0;font-family:"Noto Serif TC",serif;font-size:16px}
.odds{display:flex;align-items:center;gap:10px;margin:8px 0}
.odds .meter{flex:1;height:12px;background:#4a1f1b}
.odds .meter i{background:linear-gradient(90deg,#2f7a6a,#7fd0bd)}
.odds b{font-size:22px;font-family:"Noto Serif TC",serif;min-width:3em;text-align:right}
/* talents */
.ttree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 6px;padding:4px 0 10px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.tb{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}

function tick(){const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.98;p.l-=.022;cx.globalAlpha=Math.max(0,p.l);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x*d,p.y*d,p.r*d,0,7);cx.fill()}cx.globalAlpha=1;if(parts.length)requestAnimationFrame(tick);else{fxOn=false;cx.clearRect(0,0,cv.width,cv.height)}}
function burstAt(el,col,n){if(!el)return;const a=$('#app').getBoundingClientRect(),r=el.getBoundingClientRect();burst(r.left-a.left+r.width/2,r.top-a.top+r.height/2,col,n)}
function shake(){const a=$('#app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}

 const avail=owned().filter(h=>!busyArmy(h.id)&&!unavail(h.id));

  ${!inWorld()&&cityTiles().some(t=>t.city>1)?`<label>出發據點 <select id="originSelect">${[BASE,...cityTiles().filter(t=>t.city>1)].map(t=>`<option value="${t.r}_${t.c}" ${t===origin?'selected':''}>${t===BASE?'主城':cityName(t)}</option>`).join('')}</select></label>`:''}
  ${avail.map(h=>{const i=sel2.indexOf(h.id),task=hs(h.id).task;return`<button class="opt ${i>=0?'on':''}" data-h="${h.id}"><span class="pic" style="background-image:url(img/${h.id}.jpg)"></span><span class="t"><b>${i===0?'【主將】':i>0?'【副將】':''}${h.n}</b> <img src="img/${TCI[tcls(h.id)]}.jpg" style="width:16px;height:16px;border-radius:50%;vertical-align:-3px"><span class="small" style="color:${e?(BEATS[tcls(h.id)]===ecls(e)?'var(--jade)':BEATS[ecls(e)]===tcls(h.id)?'var(--blood)':'#cdbf9f'):'#cdbf9f'}">${TCN[tcls(h.id)][0]}${e?(BEATS[tcls(h.id)]===ecls(e)?'・克制敵軍':BEATS[ecls(e)]===tcls(h.id)?'・被敵軍克制':''):''}</span><div>統 ${stat(h.id,'cmd')}・武 ${stat(h.id,'str')}・智 ${stat(h.id,'int')}・${skills(h.id).inn[0]}</div><div>${task==='idle'?'':'目前：'+taskName(task)}</div></span></button>`}).join('')}
  ${bs.length?`<div class="meta">${bs.map(b=>`<span class="chip p">羈絆・${b[1]}：${b[2]}</span>`).join('')}</div>`:''}
  <div class="sum"><div><span>帶兵</span><span>${cap}${inWorld()?'（本地義軍補足，不耗燈塔士兵）':`（燈塔現有 ${S.soldiers}）`}</span></div><div><span>預計行軍</span><span>${turns} 旬</span></div><div><span>軍糧</span><span>約 ${food}</span></div></div>
  ${odds!==null?`<div class="odds"><span class="small">預估勝率</span><span class="meter"><i style="width:${odds*100}%"></i></span><b style="color:${odds>.7?'var(--jade)':odds>.4?'var(--gold2)':'var(--blood)'}">${Math.round(odds*100)}%</b></div>`:''}
  <button class="btn red" id="goArmy" style="width:100%" ${sel2.length?'':'disabled'}>出陣</button>`);
  $$('#sheetIn .opt').forEach(o=>o.onclick=()=>{const id=o.dataset.h,i=sel2.indexOf(id);if(i>=0)sel2.splice(i,1);else if(sel2.length<3)sel2.push(id);draw()});
  if($('#originSelect'))$('#originSelect').onchange=e=>{const [r,c]=e.target.value.split('_').map(Number);origin=(r===BASE.r&&c===BASE.c)?BASE:T(r,c);draw()};
  $('#goArmy').onclick=()=>{if(!inWorld())S.soldiers-=cap;sel2.forEach(id=>setTask(id,'army'));
   const u={id:'u'+S.uid++,gens:[...sel2],troops:cap,max:cap,r:origin.r,c:origin.c,tgt:(tgt.r===origin.r&&tgt.c===origin.c)?null:{...tgt}};S.units.push(u);closeSheet();sfx('drum');setTimeout(()=>sfx('drum'),180);vib([20,30,20]);
   sel={...tgt};render();toast(`出陣！預計 ${turns} 旬後抵達。結束本旬後部隊會自動行軍`);if(!inWorld()&&tgt.r===CITY.r&&tgt.c===CITY.c&&!S.eve){S.eve=1;setTimeout(()=>scene('eve',()=>{go('game');render()}),600)}}};
 draw()}

function checkStage(){const land=ownTiles().length,fac=S.slots.filter(s=>s&&s.lv).length,wall=hasFac('wall');
 let st=0;if(land>=11&&fac>=3)st=1;if(land>=16&&fac>=5&&wall)st=2;if(land>=22&&fac>=7&&facLv('wall')>=2)st=3;
 if(st>S.stage){S.stage=st;unlock('stage'+(st+1));queueScene('stage'+st);celebrate(STAGES[st][1],'燈塔升級',STAGES[st][0],`${STAGES[st][2]}。勢力評價：${rank(score())}`)}}
function stageNeed(){const s=S.stage;return['領地 11 格、設施 3 座','領地 16 格、設施 5 座、城牆','領地 22 格、設施 7 座、城牆 Lv2','已達最高階段'][s]}
function baseView(){
 const land=ownTiles().length,fac=S.slots.filter(s=>s&&s.lv).length,sc=score();
 return`<div class="basehero" style="background-image:url(img/${STAGES[S.stage][1]}.jpg);"><div class="cap"><h2>星盤燈塔・${STAGES[S.stage][0]}</h2><div class="stage">${STAGES.map((s,i)=>`<span class="${i<=S.stage?'on':''}">${s[0]}</span>`).join('')}</div><div class="small" style="margin-top:4px">下一階段：${stageNeed()}</div></div></div>
 <div class="sec"><div class="kpi"><div class="frame">勢力評價<b>${sc}</b>${rank(sc)}</div><div class="frame">領地<b>${land}</b>格</div><div class="frame">設施<b>${fac}</b>座</div><div class="frame">耐久<b>${S.dur}</b>/${S.durMax}</div></div>
 <div class="small" style="margin-top:6px">據點污染 ${S.pol}/100 ${S.pol>60?'<span style="color:var(--blood)">（過高：忠誠下降、流民逃散）</span>':''}${(typeof hasFac==='function'&&hasFac('mistwall'))||(typeof bfCount==='function'&&bfCount('mistwall'))?'<span style="color:#7fd0bd">（鎮霧壁壘壓制滲透、阻擋蔓延）</span>':''}</div><div class="meter" style="margin-top:3px"><i style="width:${S.pol}%;background:${S.pol>60?'var(--blood)':'var(--void)'}"></i></div>
 <div class="small" style="margin-top:6px">訓練度 ${S.train}/100</div><div class="meter" style="margin-top:3px"><i style="width:${S.train}%;background:var(--gold)"></i></div>
 ${S.policy&&S.policy.until>S.t?`<div class="sysline" style="margin-top:8px">本月政令：<b>${POLICY[S.policy.k][0]}</b>（${POLICY[S.policy.k][1]}・剩 ${S.policy.until-S.t} 旬）</div>`:''}
 <button class="btn ghost sm" id="repair" style="width:100%;margin-top:8px" ${S.dur>=S.durMax?'disabled':''}>修繕燈塔（石 30・行動 1）：耐久 +20</button></div>
 <div class="sec"><div class="orn">領地產出</div>${(()=>{const t0={food:0,wood:0,stone:0,energy:0,pop:0,pol:0};let n=0,f=0;ownTiles().forEach(t=>{const y=tileYield(t);for(const k in t0)t0[k]+=y[k];if(t.out)f++;n++});const cp=capRes();
  return`<div class="kpi"><div class="frame">糧<b>+${t0.food}</b>上限 ${cp.food}</div><div class="frame">木<b>+${t0.wood}</b>上限 ${cp.wood}</div><div class="frame">石<b>+${t0.stone}</b>上限 ${cp.stone}</div><div class="frame">流民<b>+${t0.pop}</b>上限 ${popCap()}</div></div><p class="tip" style="margin-top:6px">領地 ${n} 格、外部設施 ${f} 座。領地越大，倉儲上限、流民上限越高；被污染的領地不會產出。超過倉儲上限的資源會損失。</p>`})()}</div>
 <div class="sec"><div class="orn">設施</div><p class="tip">點空地蓋設施；點設施可指派駐紮、升級。每座設施看一項能力，有歷史專長的英靈效果翻倍。</p>
 <div class="slots">${S.slots.map((s,i)=>{if(!s)return`<button class="slot" data-i="${i}"><span class="plus">＋</span><span class="small">空地</span></button>`;const f=FAC[s.f];
  const prog=s.p<100?`<span class="prog"><i style="width:${s.p}%"></i></span>`:'';

  return`<button class="slot b" data-i="${i}" style="background-image:url(${slotArt(s.f)})">${s.lv?`<span class="lv">${'★'.repeat(s.lv)}</span>`:''}${prog}${s.gar?`<span class="gar ${gsp?'sp':''}" style="background-image:url(img/${s.gar}.jpg)"></span>`:''}<span class="nm">${f[0]}</span><span class="small">${s.lv===0?'建設中 '+s.p+'%':s.p<100?'升級中 '+s.p+'%':s.gar?H(s.gar).n+(gsp?'（專長）':''):'無人駐紮'}</span>${s.lv?`<span class="out">${facOutText(s)}</span>`:''}</button>`}).join('')}
 ${S.slots.length<20?`<button class="slot lock" id="expand"><span class="plus">⊕</span><span class="small">擴建空地<br>木 ${40+Math.max(0,S.slots.length-9)*15}・石 ${60+Math.max(0,S.slots.length-9)*20}</span></button>`:''}</div></div>`}
function facMul(s,gid){gid=gid===undefined?s.gar:gid;const f=FAC[s.f];let m=1+(s.lv-1)*.5;if(gid){const h=H(gid);m*=1+stat(gid,f[3])/100*(specialty(h.id,s.f)?2:1)}return m}
function facVal(s,gid){const f=FAC[s.f],m=facMul(s,gid);
 switch(s.f){case'granary':return Math.round(f[5]*m*(1+teamEff('food')+(T_('s3')?.2:0)));case'market':return Math.round(f[5]*m*(1+teamEff('market')));case'academy':return Math.max(1,Math.floor(m));case'office':return 1;case'observatory':return 1;default:return Math.round(f[5]*m)}}
function facOutText(s,gid){const v=facVal(s,gid);return({granary:`糧 +${v}`,houses:`流民 +${v}`,market:`木石各 +${v}`,barracks:`徵兵 +${v}%`,drill:`訓練 +${v}`,academy:`天賦 +${v}`,medic:`回復 ${v}%`,office:'行動 +1',purify:`污染 ${v}`,altar:`能量 +${v}`,observatory:'視野 +1',zhenyao:`對污染 +${v}%`,wall:`守城減傷 ${v}%`,harem:`好感 +${v}%`}[s.f]||NFTXT(s,v))+'／旬'}
function bindBase(){
 $$('.slot[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,s=S.slots[i];if(!s)pickFac(i);else facPanel(i)});

 const ex=$('#expand');if(ex)ex.onclick=()=>{const cw=40+Math.max(0,S.slots.length-9)*15,cs=60+Math.max(0,S.slots.length-9)*20;if(S.wood<cw||S.stone<cs){sfx('deny');return toast('木材或石材不足')}S.wood-=cw;S.stone-=cs;S.slots.push(null);sfx('build');render()};

 $$('#sheetIn .opt').forEach(o=>o.onclick=()=>{const k=o.dataset.f,f=FAC[k];if(S.wood<f[2][0]||S.stone<f[2][1]){sfx('deny');return toast('資源不足')}
  S.wood-=f[2][0];S.stone-=f[2][1];const [bank,idx]=slotBank(i);bank[idx]={f:k,lv:0,p:0,gar:null};sfx('build');closeSheet();pickBuilder(i)});

 ${s.lv<5?`<div class="orn">升級</div><div class="small">升到 Lv${s.lv+1}：產出 +50%${s.lv+1===3||s.lv+1===5?`，並解鎖特性【${FPERK[s.f]?FPERK[s.f][s.lv+1===3?0:1][0]:''}】`:''}。升級期間仍會產出，需要指派建設者。</div>${costHtml(uw,us)}<button class="btn" id="fUp" style="width:100%;margin-top:8px">升級</button>`:''}`);

 }
