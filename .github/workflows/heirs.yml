name: Mobile succession and map checks
on:
  push:
    branches: ['qa/heirs-1123-*']
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pip install playwright
      - run: |
          python -m http.server 8746 >/tmp/game-http.log 2>&1 &
          python heirscheck.py
